<div class="modal fade" id="completeModal" tabindex="-1" data-bs-backdrop="static">
  <div class="modal-dialog modal-dialog-centered">
    <div class="modal-content text-center">
      <div class="modal-body p-4" id="completeModalBody">
        <div class="result-emoji mb-2">🎉</div>
        <h4 class="fw-bold">Congratulations!</h4>
        <p class="text-muted">Puzzle Completed</p>
        <div class="row g-2 my-3">
          <div class="col-6"><div class="card p-2"><div class="small text-muted">Time</div><div class="fw-bold" id="finalTime">-</div></div></div>
          <div class="col-6"><div class="card p-2"><div class="small text-muted">Score</div><div class="fw-bold" id="finalScore">-</div></div></div>
          <div class="col-12"><div class="card p-2"><div class="small text-muted">Hints Used</div><div class="fw-bold" id="finalHints">-</div></div></div>
        </div>
        <div class="stars mb-3" id="finalStars">⭐⭐⭐</div>
        <div class="d-flex gap-2 justify-content-center">
          <button class="btn btn-primary" onclick="window.location.reload()">Play Again</button>
          <a href="{{ url_for('home') }}" class="btn btn-outline-secondary">Home</a>
        </div>
      </div>
    </div>
  </div>
</div>
