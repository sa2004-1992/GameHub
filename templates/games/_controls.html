<div class="d-flex flex-wrap justify-content-center gap-2 mt-3">
  <button id="hintBtn" class="btn btn-outline-warning btn-sm"><i class="bi bi-lightbulb"></i> Hint</button>
  <button id="undoBtn" class="btn btn-outline-secondary btn-sm"><i class="bi bi-arrow-counterclockwise"></i> Undo</button>
  <button id="pauseBtn" class="btn btn-outline-secondary btn-sm">⏸ Pause</button>
  <button id="restartBtn" class="btn btn-outline-secondary btn-sm"><i class="bi bi-arrow-repeat"></i> Restart</button>
  <button id="checkBtn" class="btn btn-outline-success btn-sm"><i class="bi bi-check2-circle"></i> Check Solution</button>
  <button id="exitBtn" class="btn btn-outline-danger btn-sm"><i class="bi bi-box-arrow-left"></i> Exit</button>
</div>
